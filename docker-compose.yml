# Pull (or build) the app. JSON stays on the host in ./data.
services:
  tiddeliquiz:
    image: ghcr.io/berndtjohannsen/tiddeliquiz:latest
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
